<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق طلبيات اليوم الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-24">

    <!-- رأس التطبيق -->
    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold"><i class="fa-solid fa-sun ml-2 text-yellow-300"></i>طلبيات اليوم</h1>
            <span id="today-orders-badge" class="bg-white/20 text-xs px-3 py-1 rounded-full font-medium">0 طلبات اليوم</span>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-md">

        <!-- أزرار الإجراءات السريعة -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <button onclick="openModalForAdd()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-3 rounded-xl shadow transition duration-200 flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-plus-circle"></i> طلب جديد
            </button>
            <button onclick="toggleAIMappingModal(true)" class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-medium py-3 px-3 rounded-xl shadow transition duration-200 flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-wand-magic-sparkles"></i> مساعد ذكي (AI)
            </button>
        </div>

        <!-- إعدادات تخصيص الحالات والرسالة -->
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 mb-4 space-y-3">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1"><i class="fa-solid fa-tags text-indigo-600 ml-1"></i> تخصيص حالات الطلبية (افصل بينها بفاصلة):</label>
                <div class="flex gap-2">
                    <input type="text" id="custom-statuses-input" class="w-full p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-500" value="غير مؤكدة,مؤكدة,في الطريق إليك,تم التوصيل,ملغي">
                    <button onclick="saveStatuses()" class="bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg hover:bg-indigo-700">حفظ</button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1"><i class="fa-solid fa-message text-green-600 ml-1"></i> رسالة الواتساب للعميل:</label>
                <textarea id="custom-whatsapp-template" rows="2" class="w-full p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-green-500" oninput="saveWhatsappTemplate()">سلام عليكم أسي/أستاذة [NAME] 👋 بخصوص الطلبية ديالك ([PRODUCT]) بثمن [PRICE] درهم، كنعلموك بلي الكوموند خرجات وغتكون عندك في ظرف 24 ساعة. شكراً!</textarea>
                <p class="text-[10px] text-gray-400 mt-0.5">استعمل: [NAME], [PRODUCT], [PRICE]</p>
            </div>
        </div>

        <!-- قائمة الطلبيات -->
        <div class="mb-3 flex justify-between items-center">
            <h2 class="text-sm font-bold text-gray-700">طلبيات اليوم المسجلة</h2>
            <button onclick="clearTodayOrders()" class="text-xs text-red-500 hover:underline">مسح طلبيات اليوم</button>
        </div>

        <div id="orders-list" class="space-y-3">
            <div class="text-center py-10 text-gray-400 bg-white rounded-xl border border-dashed border-gray-300">
                <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                <p class="text-sm">لا توجد طلبيات مسجلة لهذا اليوم</p>
            </div>
        </div>
    </main>

    <!-- نموذج إضافة أو تعديل طلب -->
    <div id="order-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 id="modal-title" class="font-bold text-md text-gray-800">إضافة طلب جديد</h3>
                <button onclick="toggleModal(false)" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            </div>
            
            <form id="order-form" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="order-id-hidden">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">اسم العميل</label>
                    <input type="text" id="client-name" required class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="مثال: أمين البكاري">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">رقم الهاتف (واتساب)</label>
                    <input type="tel" id="client-phone" required class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="06xxxxxxxx">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">المنتج</label>
                        <input type="text" id="product-name" required class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="اسم المنتج">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">المدينة</label>
                        <input type="text" id="client-city" required class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="المدينة">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">الثمن (د.م)</label>
                        <input type="number" id="product-price" required class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">حالة الطلبية</label>
                        <select id="order-status-select" class="w-full p-2.5 border rounded-lg text-sm outline-none bg-white">
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">ملاحظات (اختياري)</label>
                    <input type="text" id="order-notes" class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="مثال: يتصل قبل المجيء، اللون أسود...">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">صورة المنتج (من الهاتف)</label>
                    <input type="file" id="product-image-file" accept="image/*" class="w-full p-2 border rounded-lg text-xs file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>
                <div class="pt-2">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl shadow transition">حفظ التغييرات</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة المساعد الذكي المطور -->
    <div id="ai-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3 border-b pb-2">
                <h3 class="font-bold text-md text-purple-700 flex items-center gap-1.5"><i class="fa-solid fa-wand-magic-sparkles"></i> المساعد الذكي (يقرأ الاسم، المنتج والثمن)</h3>
                <button onclick="toggleAIMappingModal(false)" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            </div>
            <p class="text-xs text-gray-500 mb-3">الصق رسالة العميل هنا، وسيقوم المساعد باستخراج الاسم، رقم الهاتف، المنتج والثمن أوتوماتيكياً:</p>
            
            <textarea id="raw-ai-text" rows="5" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-purple-500 mb-3" placeholder="مثال: سلام معكم يوسف من مراكش بغيت سبرديلة نايك نمرة 42 الثمن 300 درهم وهاض هو نمرتي 0612345678"></textarea>
            
            <button onclick="processAIInput()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-medium py-3 rounded-xl shadow transition mb-2">تعبئة الخانات بالذكاء الاصطناعي</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const todayKey = 'orders_' + new Date().toISOString().slice(0, 10);
        let orders = JSON.parse(localStorage.getItem(todayKey)) || [];

        let defaultStatuses = ["غير مؤكدة", "مؤكدة", "في الطريق إليك", "تم التوصيل", "ملغي"];
        const savedStatusesStr = localStorage.getItem('custom_statuses');
        if(savedStatusesStr) {
            defaultStatuses = savedStatusesStr.split(',').map(s => s.trim());
            document.getElementById('custom-statuses-input').value = savedStatusesStr;
        }

        function saveStatuses() {
            const val = document.getElementById('custom-statuses-input').value;
            if(!val) return;
            localStorage.setItem('custom_statuses', val);
            defaultStatuses = val.split(',').map(s => s.trim());
            updateStatusDropdowns();
            alert('تم حفظ وتحديث حالات الطلبيات بنجاح!');
        }

        function updateStatusDropdowns() {
            const selects = document.querySelectorAll('#order-status-select, .dynamic-status-select');
            selects.forEach(sel => {
                const currentVal = sel.value;
                sel.innerHTML = defaultStatuses.map(st => `<option value="${st}" ${st === currentVal ? 'selected' : ''}>${st}</option>`).join('');
            });
        }

        const savedTemplate = localStorage.getItem('whatsapp_template');
        if(savedTemplate) {
            document.getElementById('custom-whatsapp-template').value = savedTemplate;
        }

        function saveWhatsappTemplate() {
            const val = document.getElementById('custom-whatsapp-template').value;
            localStorage.setItem('whatsapp_template', val);
        }

        function toggleModal(show) {
            const modal = document.getElementById('order-modal');
            if (show) {
                updateStatusDropdowns();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                document.getElementById('order-form').reset();
                document.getElementById('order-id-hidden').value = '';
            }
        }

        function openModalForAdd() {
            document.getElementById('modal-title').innerText = 'إضافة طلب جديد';
            document.getElementById('order-form').reset();
            document.getElementById('order-id-hidden').value = '';
            toggleModal(true);
        }

        function openModalForEdit(id) {
            const ord = orders.find(o => o.id === id);
            if(!ord) return;

            document.getElementById('modal-title').innerText = 'تعديل الطلبية';
            document.getElementById('order-id-hidden').value = ord.id;
            document.getElementById('client-name').value = ord.name;
            document.getElementById('client-phone').value = ord.phone;
            document.getElementById('product-name').value = ord.product;
            document.getElementById('client-city').value = ord.city || '';
            document.getElementById('product-price').value = ord.price;
            document.getElementById('order-notes').value = ord.notes || '';
            
            updateStatusDropdowns();
            document.getElementById('order-status-select').value = ord.status;
            
            toggleModal(true);
        }

        function toggleAIMappingModal(show) {
            const modal = document.getElementById('ai-modal');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                document.getElementById('raw-ai-text').value = '';
            }
        }

        // المساعد الذكي المطور لاستخراج الاسم، المنتج، الثمن، والمدينة بدقة
        function processAIInput() {
            const text = document.getElementById('raw-ai-text').value.trim();
            if(!text) {
                alert('المرجو كتابة أو لصق رسالة العميل أولاً!');
                return;
            }

            // 1. استخراج رقم الهاتف
            const phoneMatch = text.match(/(?:0|\+212)[5-7]\d{8}/) || text.match(/\d{9,10}/);
            const phone = phoneMatch ? phoneMatch[0] : '';

            // 2. استخراج الثمن (أرقام بجانبها درهم، د.م، dh)
            const priceMatch = text.match(/(\d+)\s*(درهم|د\.م|dh|DH)/i) || text.match(/(?:الثمن|بـ|بثمن|السعر)\s*[:]?\s*(\d+)/i);
            const price = priceMatch ? parseFloat(priceMatch[1] || priceMatch[2]) : '';

            // 3. استخراج اسم العميل (محاولة استنباطه من عبارات مثل "معاكم X" أو "أنا X" أو "إسمي X")
            let name = "عميل";
            const nameMatch = text.match(/(?:معاكم|معك|أنا|إسمي|سميتي|السمية ديالي)\s+([أ-يئىآأإة\w\s]{2,15})(?:\s|,|\.|من)/u);
            if (nameMatch && nameMatch[1]) {
                name = nameMatch[1].trim();
            }

            // 4. استخراج المدينة (من قائمة المدن المغربية الشائعة أو بعد كلمة "من")
            let city = "المغرب";
            const commonCities = ["الدار البيضاء", "كازا", "مراكش", "الرباط", "فاس", "طنجة", "أكادير", "مكناس", "وجدة", "تطوان", "سلا", "الخريبكة", "آسفي", "الجديدة", "بني ملال", "القنيطرة", "صخيرات", "تمارة", "برشيد", "سطات"];
            for (let c of commonCities) {
                if (text.includes(c)) {
                    city = c === "كازا" ? "الدار البيضاء" : c;
                    break;
                }
            }
            if (city === "المغرب") {
                const cityMatch = text.match(/من\s+([أ-يئىآأإة\w]{3,15})/u);
                if (cityMatch && cityMatch[1] && !cityMatch[1].includes("درهم")) {
                    city = cityMatch[1].trim();
                }
            }

            // 5. استخراج اسم المنتج (تخمين مبدئي من النص)
            let product = "منتج مطلوب";
            const productMatch = text.match(/(?:بغيت|باغي|رغبت في|أريد)\s+([أ-يئىآأإة\w\s]{3,20})(?:\s+الثمن|من|بثمن|بـ|,|\.|$)/u);
            if (productMatch && productMatch[1]) {
                product = productMatch[1].trim();
            }

            // إنشاء الطلب مباشرة بهذه المعلومات المستخرجة
            const newOrder = {
                id: Date.now(),
                name: name,
                phone: phone,
                product: product,
                city: city,
                price: price || 0,
                notes: text,
                image: "",
                status: defaultStatuses[0] || 'غير مؤكدة'
            };

            orders.unshift(newOrder);
            syncAndRender();
            toggleAIMappingModal(false);
            
            // فتح نافذة التعديل لكي تتأكد من المعلومات وتصححها بضغطة زر إذا لزم الأمر
            openModalForEdit(newOrder.id);
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const idVal = document.getElementById('order-id-hidden').value;
            const name = document.getElementById('client-name').value;
            const phone = document.getElementById('client-phone').value;
            const product = document.getElementById('product-name').value;
            const city = document.getElementById('client-city').value;
            const price = parseFloat(document.getElementById('product-price').value);
            const status = document.getElementById('order-status-select').value;
            const notes = document.getElementById('order-notes').value;
            const imageFile = document.getElementById('product-image-file').files[0];

            const saveRecord = (imgData) => {
                if (idVal) {
                    orders = orders.map(ord => {
                        if (ord.id === parseInt(idVal)) {
                            return {
                                ...ord,
                                name, phone, product, city, price, status, notes,
                                image: imgData !== undefined ? imgData : ord.image
                            };
                        }
                        return ord;
                    });
                } else {
                    const newOrder = {
                        id: Date.now(),
                        name, phone, product, city, price, status, notes,
                        image: imgData || ""
                    };
                    orders.unshift(newOrder);
                }
                syncAndRender();
                toggleModal(false);
            };

            if (imageFile) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    saveRecord(uploadEvent.target.result);
                };
                reader.readAsDataURL(imageFile);
            } else {
                saveRecord(undefined);
            }
        }

        function updateInlineStatus(id, newStatus) {
            orders = orders.map(ord => ord.id === id ? {...ord, status: newStatus} : ord);
            syncAndRender();
        }

        function deleteOrder(id) {
            if(confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
                orders = orders.filter(ord => ord.id !== id);
                syncAndRender();
            }
        }

        function clearTodayOrders() {
            if(confirm('هل تريد مسح جميع طلبيات اليوم؟')) {
                orders = [];
                syncAndRender();
            }
        }

        function sendAutoWhatsApp(phone, name, product, price) {
            let formattedPhone = phone.replace(/\D/g,'');
            if(formattedPhone.startsWith('0')) {
                formattedPhone = '212' + formattedPhone.substring(1);
            }
            
            let template = document.getElementById('custom-whatsapp-template').value;
            let message = template
                .replace(/\[NAME\]/g, name)
                .replace(/\[PRODUCT\]/g, product)
                .replace(/\[PRICE\]/g, price);

            const url = `https://wa.me/${formattedPhone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }

        function syncAndRender() {
            localStorage.setItem(todayKey, JSON.stringify(orders));
            renderOrders();
            updateStats();
        }

        function updateStats() {
            document.getElementById('today-orders-badge').innerText = orders.length + ' طلبات اليوم';
        }

        function renderOrders() {
            const listEl = document.getElementById('orders-list');
            if (orders.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-10 text-gray-400 bg-white rounded-xl border border-dashed border-gray-300">
                        <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                        <p class="text-sm">لا توجد طلبيات مسجلة لهذا اليوم</p>
                    </div>`;
                return;
            }

            listEl.innerHTML = orders.map(ord => {
                return `
                    <div class="bg-white p-3.5 rounded-xl shadow-sm border border-gray-100 space-y-2">
                        <div class="flex items-center gap-3">
                            ${ord.image ? `<img src="${ord.image}" class="w-14 h-14 object-cover rounded-lg border">` : `<div class="w-14 h-14 bg-gray-100 rounded-lg flex items-center justify-center text-gray-400 text-xs"><i class="fa-solid fa-image"></i></div>`}
                            <div class="flex-1">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-sm text-gray-800">${ord.name}</h3>
                                    <select onchange="updateInlineStatus(${ord.id}, this.value)" class="dynamic-status-select text-[11px] font-medium px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-100 outline-none">
                                        ${defaultStatuses.map(st => `<option value="${st}" ${st === ord.status ? 'selected' : ''}>${st}</option>`).join('')}
                                    </select>
                                </div>
                                <p class="text-xs text-gray-500 mt-0.5"><i class="fa-solid fa-location-dot ml-1"></i>${ord.city || 'غير محددة'} | <i class="fa-solid fa-phone ml-1"></i>${ord.phone}</p>
                                <div class="flex justify-between items-center mt-1">
                                    <span class="text-xs font-semibold text-gray-700">${ord.product}</span>
                                    <span class="text-xs font-bold text-indigo-600">${ord.price} د.م</span>
                                </div>
                                ${ord.notes ? `<p class="text-[11px] text-amber-700 bg-amber-50 p-1 rounded mt-1"><i class="fa-solid fa-note-sticky ml-1"></i>ملاحظة: ${ord.notes}</p>` : ''}
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t text-xs gap-2">
                            <button onclick="openModalForEdit(${ord.id})" class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1">
                                <i class="fa-solid fa-pen-to-square"></i> تعديل
                            </button>
                            
                            <div class="flex gap-1.5">
                                <button onclick="sendAutoWhatsApp('${ord.phone}', '${ord.name}', '${ord.product}', ${ord.price})" class="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded-lg flex items-center gap-1 font-medium transition shadow-sm">
                                    <i class="fa-brands fa-whatsapp text-sm"></i> واتساب
                                </button>
                                <button onclick="deleteOrder(${ord.id})" class="text-red-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        renderOrders();
        updateStats();
    </script>
</body>
</html>
